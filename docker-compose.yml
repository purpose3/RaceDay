# Starts the whole RaceDay system with one command:  docker compose up --build
#   Website  -> http://localhost:8080
#   API docs -> http://localhost:8081/swagger
name: raceday

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-RaceDay_Passw0rd!2026}"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --location /data
    volumes:
      - azurite-data:/data

  api:
    build: ./RaceDay.Api
    environment:
      ConnectionStrings__RaceDayDb: "Server=sqlserver,1433;Database=RaceDayApiDB;User Id=sa;Password=${SA_PASSWORD:-RaceDay_Passw0rd!2026};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-raceday-docker-demo-key-change-me-0123456789abcdef}"
      Registration__OrganiserInviteCode: "${ORGANISER_INVITE_CODE:-RACEDAY-ORGANISER-2026}"
      # Azurite's well-known public development account, reached over the compose network
      AzureStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started

  web:
    build: ./RaceDay.Web
    environment:
      Api__BaseUrl: "http://api:8080"
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  sqldata:
  azurite-data:
